[project]
name = "gtm-deal-pipeline"
version = "0.1.0"
description = "GTM deal qualification pipeline (BANTi-F3 scoring + discovery + solution shaping) with a Gradio UI"
requires-python = ">=3.10"
dependencies = [
    "gradio==6.9.0",
    "anthropic==0.85.0",
    "pandas==3.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# เลือกชุดกฎชัดเจน — ไม่พึ่ง config ภายนอก repo
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "E402",  # imports หลัง sys.stdout.reconfigure — จงใจ (ต้องตั้ง encoding ก่อน)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
